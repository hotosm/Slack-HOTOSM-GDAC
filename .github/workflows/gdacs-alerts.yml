name: Disaster & Outbreak Alerts

on:
  schedule:
    - cron: '1 0 * * *'   # 00:01 UTC daily
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'WHO DON dry run (preview only, no Slack post)'
        type: boolean
        default: false
      lookback_days:
        description: 'WHO DON lookback window in days (used only if start_date is blank)'
        type: string
        default: '30'
      start_date:
        description: 'WHO DON cutoff date, e.g. 2026-01-01 (overrides lookback_days if set)'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  check-alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run GDACS alert check
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python gdacs-slack.py

      - name: Run WHO DON alert check
        if: ${{ !cancelled() }}   # still run if the GDACS step failed
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DRY_RUN: ${{ inputs.dry_run }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days }}
          START_DATE: ${{ inputs.start_date }}
        run: python who-don-slack.py

      - name: Commit updated state files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_events.json
          if [ -f posted_dons.json ]; then git add posted_dons.json; fi
          git diff --staged --quiet || git commit -m "Update posted event state"
          git push
